#!/bin/bash
# targets/lightftp.conf — LightFTP（真第三方 FTP 服务器）靶机适配器
#
# 来源：third_party/lightftp/，上游未改动（`git diff` 为空）。
# 它是 AFL++ 插桩编译的常驻 FTP 服务，用来验证「覆盖率零侵入注入」对
# 真实开源目标同样成立 —— 靶机源码里没有任何 SBF 代码、没有 record_cov()。
#
# 用法:
#   TARGET_CONF=targets/lightftp.conf ./run_state_node.sh state_2_auth 3 300
#
# FTP 有两个跟我们判据相关的特点（这次接入才发现的）：
#   1. 连上就先发 banner（220 ...）—— 判活若只读 1 行会把 banner 当成应答，
#      必须先把 banner 读掉。见 TARGET_BANNER_LINES。
#   2. HELP 是多行应答（214-... 多行 ... 214 Help OK.）—— 前缀/探活命令
#      必须选一命令一行的（NOOP 就是）。

TARGET_NAME=fftp

# 构建：4 个源文件 + GnuTLS。源码零改动，只是用插桩编译器编。
TARGET_SRC=
TARGET_BUILD_CMD='afl-clang-fast third_party/lightftp/Source/cfgparse.c third_party/lightftp/Source/ftpserv.c third_party/lightftp/Source/main.c third_party/lightftp/Source/x_malloc.c -o third_party/lightftp/fftp -lgnutls -lpthread'

# 上游从配置文件读端口，不接受命令行传参 —— 由启动器按 $PORT 生成 conf
TARGET_BIN=./targets/lightftp.sh
TARGET_ARGS='$PORT'

# NOOP 在任何 FTP 状态都回一行
TARGET_PROBE_CMD=$'NOOP\r\n'

TARGET_SHM_SIZE=65536
TARGET_RECV_IDLE_US=10000

# 真目标：只靠 __AFL_SHM_ID，源码零侵入
TARGET_COV_MODE=instrument

TARGET_NEEDS_RESTART=1

# FTP 连上先送一行 banner，harness 必须先读掉再发探测/前缀
TARGET_BANNER_LINES=1
