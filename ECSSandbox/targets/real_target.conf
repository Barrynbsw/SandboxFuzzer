# targets/real_target.conf — "真目标"演示适配器
#
# tests/poc/real_target.c：一个【不含任何 SandboxFuzzer 代码、不碰任何 __afl_* 符号】
# 的 TCP 服务。用来证明覆盖率注入可以做到零侵入靶机源码 —— 只设 __AFL_SHM_ID，
# AFL++ 运行时自己把 __afl_area_ptr 指到那个段上。
#
# 这就是接真靶机的形态：改一行适配器配置，靶机源码一个字都不用动。

TARGET_NAME="real_target"
TARGET_SRC="tests/poc/real_target.c"
TARGET_BIN="./tests/bin/real_target"
TARGET_ARGS='$PORT'

TARGET_PROBE_CMD='NOOP\r\n'
TARGET_SHM_SIZE=65536
TARGET_RECV_IDLE_US=10000

# 真目标只能走插桩：没有 record_cov() 可调
TARGET_COV_MODE="instrument"

TARGET_NEEDS_RESTART=1
