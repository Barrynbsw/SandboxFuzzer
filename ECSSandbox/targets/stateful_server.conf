# targets/stateful_server.conf — mock 靶机适配器
#
# 有状态协议 mock（S0/S1/S2），埋了两个崩溃点：
#   S1 浅层:  PASS CRASH*     → abort()
#   S2 深层:  STOR BUG*       → abort()
#
# 每一项的含义见 targets/README.md。

TARGET_NAME="stateful_server"          # 进程名（pkill -x 用）
TARGET_SRC="stateful_server.c"         # 要编译的源文件；留空则用现成二进制
TARGET_BIN="./stateful_server"
TARGET_ARGS='$PORT'                  # 启动参数；$PORT 会被替换成靶机端口

TARGET_PROBE_CMD='NOOP\r\n'            # 判活命令：任何协议状态都必须应答
TARGET_SHM_SIZE=65536                  # 覆盖率位图长度
TARGET_RECV_IDLE_US=10000              # 靶机 recv 空闲超时（harness 据此设 socket 超时）

# 覆盖率来源：
#   instrument  只靠 __AFL_SHM_ID —— 插桩自动写，零侵入靶机源码（真目标用这个）
#   manual      只靠 TARGET_SHM_ID + 靶机自己调 record_cov()（老路，覆盖面差）
#   both        两个都开（mock 用：插桩为主，record_cov 作补充）
TARGET_COV_MODE="both"

TARGET_NEEDS_RESTART=1                 # 崩溃后由保活循环拉起
